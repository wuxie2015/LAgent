[project]
name = "lin-agent"
version = "0.1.0"
description = "A local personal agent powered by Ollama"
requires-python = ">=3.11"

[project.scripts]
lin-agent = "lin_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lin_agent"]
